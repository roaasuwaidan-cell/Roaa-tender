name: NUPCO Tender Tracker

on:
  schedule:
    # Hourly. Minute 17 avoids the top-of-hour rush when GitHub drops/delays cron jobs.
    - cron: '17 * * * *'
  workflow_dispatch:

# Never run two trackers at once (would race on state.json)
concurrency:
  group: nupco-tender-tracker
  cancel-in-progress: false

permissions:
  contents: write   # commit state.json
  actions: write    # re-enable the schedule if GitHub ever disables it

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tracker
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scraper.py

      # always() -> state is saved even when the run is red, so undelivered
      # alerts stay pending and are retried on the next run.
      - name: Commit state
        if: always()
        run: |
          git config user.name "nupco-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f state.json ]; then git add state.json; fi
          if git diff --cached --quiet; then echo "No state change."; exit 0; fi
          git commit -m "chore: update tender state"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
               && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep $((i * 5))
          done
          echo "Could not push state after 5 attempts" && exit 1

      # GitHub disables scheduled workflows after 60 days without repo activity.
      - name: Keep schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable "NUPCO Tender Tracker" --repo "$GITHUB_REPOSITORY" || true
